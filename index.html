<title>Registro de cargas Voleibol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: banda negra de marca arriba, pestañas fijas (Día 1-3, Resumen, Guía) y debajo
   tarjetas por ejercicio (vista semana) o la tabla de 8 semanas del Excel. */
:root{
  --bg:#0B0B0C; --surface:#141416; --surface-2:#1C1C1F; --line:#2B2B2F; --line-soft:#222226;
  --fg:#F3F0E8; --muted:#A09B90; --faint:#77736A;
  --gold:#C9A24B; --gold-text:#D8B665; --gold-soft:#F0DFA8; --on-gold:#111111;
  --appr-bg:#2A2412; --appr-line:#6B5A27;
  --in-bg:#0F0F11; --in-line:#36363C;
  --up:#53C28B; --up-bg:rgba(83,194,139,.15); --down:#EF6F68; --down-bg:rgba(239,111,104,.15);
  --hdr-bg:#050505; --hdr-fg:#F3F0E8;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F4F1; --surface:#FFFFFF; --surface-2:#EEEDE8; --line:#D8D6CE; --line-soft:#E7E5DE;
    --fg:#121212; --muted:#5C5951; --faint:#8A867C;
    --gold:#B8903A; --gold-text:#7A5C12; --gold-soft:#F0DFA8; --on-gold:#111111;
    --appr-bg:#FBF3DA; --appr-line:#D6BC73;
    --in-bg:#FFFFFF; --in-line:#CBC8BE;
    --up:#17774A; --up-bg:rgba(23,119,74,.12); --down:#B0332B; --down-bg:rgba(176,51,43,.1);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F4F4F1; --surface:#FFFFFF; --surface-2:#EEEDE8; --line:#D8D6CE; --line-soft:#E7E5DE;
  --fg:#121212; --muted:#5C5951; --faint:#8A867C;
  --gold:#B8903A; --gold-text:#7A5C12; --gold-soft:#F0DFA8; --on-gold:#111111;
  --appr-bg:#FBF3DA; --appr-line:#D6BC73;
  --in-bg:#FFFFFF; --in-line:#CBC8BE;
  --up:#17774A; --up-bg:rgba(23,119,74,.12); --down:#B0332B; --down-bg:rgba(176,51,43,.1);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
.tnum,.setin,.stats b,.rt td,.tbl td{font-variant-numeric:tabular-nums}

/* Cabecera */
.top{background:var(--hdr-bg);color:var(--hdr-fg);border-bottom:1px solid #2a2512}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand-t{font-family:var(--f-display);font-weight:700;font-size:23px;letter-spacing:.06em;text-transform:uppercase;line-height:1;color:var(--hdr-fg)}
.brand-s{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#C9A24B;margin-top:5px}
.top-r{display:flex;align-items:center;justify-content:flex-end;gap:6px 12px;min-width:0;max-width:100%;flex-wrap:wrap}
.status{font-size:12px;color:#8f8a7e;white-space:nowrap}
.status.err{color:#EF8F89}
.who{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:min(240px,100%);background:transparent;border:1px solid #6B5A27;color:#F0DFA8;border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who:hover{background:#1c1809}

/* Menú de registros */
.menu{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px;display:grid;gap:14px}
.menu h4{margin:0 0 8px;font-family:var(--f-display);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text);font-weight:600}
.alist{display:grid;gap:6px}
.aitem{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;min-height:44px}
.aitem.on{border-color:var(--gold)}
.aitem small{color:var(--muted)}
.rowf{display:flex;gap:8px;flex-wrap:wrap}
.rowf input{flex:1 1 180px;min-width:0;background:var(--in-bg);border:1px solid var(--in-line);border-radius:8px;padding:10px 12px;min-height:44px}
.btn{background:var(--gold);color:var(--on-gold);border:0;border-radius:8px;padding:10px 16px;font-weight:600;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.danger{background:var(--down);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.confirm{display:grid;gap:8px;background:var(--down-bg);border-radius:8px;padding:12px}

/* Avisos */
.note{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:13px}
.note b{color:var(--fg)}

/* Pestañas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:14px 14px 11px;font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--gold-text);border-bottom-color:var(--gold)}

main{padding-block:22px 64px}
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-family:var(--f-display);font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-text);font-weight:600}
h1{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,6vw,44px);line-height:1.02;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:9px 14px;min-height:40px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);font-weight:600}

/* Barra de semana */
.wkbar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin-bottom:6px}
.wks{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wks .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.wk{position:relative;width:42px;height:42px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-display);font-weight:600;font-size:19px;color:var(--muted)}
.wk:hover{border-color:var(--gold)}
.wk[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.wk .dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:transparent}
.wk .dot.has{background:var(--gold)}
.wk[aria-pressed="true"] .dot.has{background:var(--on-gold)}
.datef{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.datef input{background:var(--in-bg);border:1px solid var(--in-line);border-radius:8px;padding:8px 10px;min-height:42px;color:var(--fg)}

h2.sec{margin:26px 0 12px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-text);display:flex;align-items:center;gap:12px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}

/* Tarjetas de ejercicio */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:14px}
.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.c-head{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:30px;height:30px;border-radius:6px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px}
.c-head h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.1;letter-spacing:.01em;min-width:0;text-wrap:balance}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;letter-spacing:.04em;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface-2)}
.pill.pauta{color:var(--gold-text);border-color:var(--appr-line)}
.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 0}
.sets{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
.sets.c1{grid-template-columns:repeat(1,minmax(0,1fr))}
.sets.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.sets.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sets.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.pair{display:flex;gap:4px;min-width:0}
.pair .inw{flex:1 1 0;min-width:0}
.ririn{flex:0 0 44px;width:44px;min-width:0;height:48px;padding:0;text-align:center;font-size:16px;font-weight:600;background:var(--in-bg);border:1px solid var(--in-line);border-radius:8px;color:var(--fg)}
.ririn::placeholder,.rpein::placeholder{font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--faint)}
.ririn:focus,.rpein:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent)}
.set.appr .ririn{background:var(--appr-bg);border-color:var(--appr-line)}
.rpe{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.rpe i{font-style:normal;color:var(--faint);margin-left:4px}
.rpein{width:76px;height:44px;text-align:center;font-size:17px;font-weight:600;background:var(--in-bg);border:1px solid var(--in-line);border-radius:8px;color:var(--fg)}
.flags{display:flex;gap:8px 22px;flex-wrap:wrap;width:100%;border-top:1px solid var(--line-soft);padding-top:12px}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:36px;color:var(--fg);font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--gold)}
.tbl .ririn.tr{display:block;width:60px;height:26px;margin-top:3px;font-size:12px;border-radius:6px}
.tbl .ririn.tr::placeholder{font-size:10px}
.tbl td.c .set{display:block}
.set>span{overflow:hidden;text-overflow:ellipsis}
.set>span .lu{display:none;font-weight:500}
.sets.rir.c3 .inw em,.sets.rir.c4 .inw em{display:none}
.sets.rir.c3 .setin,.sets.rir.c4 .setin{padding:0 8px;font-size:18px}
.sets.rir.c3 .lu,.sets.rir.c4 .lu{display:inline}
.set{display:flex;flex-direction:column;gap:4px;min-width:0}
.set>span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.inw{position:relative}
.inw em{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;color:var(--faint);pointer-events:none}
.setin{width:100%;min-width:0;height:48px;padding:0 30px 0 10px;text-align:right;font-size:19px;font-weight:600;background:var(--in-bg);border:1px solid var(--in-line);border-radius:8px;color:var(--fg)}
.setin::placeholder{color:var(--faint);font-weight:400}
.setin:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent)}
.set.appr .setin{background:var(--appr-bg);border-color:var(--appr-line)}
.set.appr>span{color:var(--gold-text)}
.setin.up{border-color:var(--up);background:var(--up-bg)}
.setin.down{border-color:var(--down);background:var(--down-bg)}
.live{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;min-height:30px;font-size:13.5px;color:var(--muted)}
.live b{color:var(--fg);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-weight:600;font-size:13px}
.chip.up{background:var(--up-bg);color:var(--up)}
.chip.down{background:var(--down-bg);color:var(--down)}
.chip.eq{background:var(--surface-2);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;border-top:1px solid var(--line-soft);padding-top:12px}
.st{display:flex;flex-direction:column;gap:2px;min-width:0}
.st span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.st b{font-size:16px;font-weight:600;white-space:nowrap}
.st b.up{color:var(--up)} .st b.down{color:var(--down)}
.spark svg{display:block;width:100%;height:auto;max-height:118px}
.spk .ax{font-size:10px;fill:var(--muted);font-family:var(--f-body)}
.spk .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.spk .base{stroke:var(--line);stroke-width:1}
.spk .ln{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spk .pt{fill:var(--surface);stroke:var(--gold);stroke-width:2}
.spk .last{fill:var(--gold);stroke:var(--surface);stroke-width:2}
.spk .val{font-size:11px;font-weight:600;fill:var(--fg);font-family:var(--f-body)}
.spk .empty{font-size:11px;fill:var(--faint);font-family:var(--f-body)}
details.notes summary{cursor:pointer;color:var(--muted);font-size:13px;min-height:30px;display:flex;align-items:center}
details.notes summary:hover{color:var(--gold-text)}
.notein{width:100%;margin-top:6px;min-height:68px;resize:vertical;background:var(--in-bg);border:1px solid var(--in-line);border-radius:8px;padding:10px 12px}
.notein:focus{outline:none;border-color:var(--gold)}

/* Tabla de 8 semanas */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl{border-collapse:separate;border-spacing:0;font-size:13px;min-width:max-content}
.tbl th,.tbl td{padding:0;border-bottom:1px solid var(--line-soft);background:var(--surface)}
.tbl thead th{background:#0B0B0C;color:var(--gold-soft);font-family:var(--f-display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;padding:8px 6px;text-align:center;border-bottom:1px solid #2a2512}
.tbl thead th.gl,.tbl td.gl{border-left:1px solid var(--line)}
.tbl .stick{position:sticky;left:0;z-index:2;text-align:left;min-width:210px;max-width:210px;padding:8px 12px;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.tbl thead th.stick{background:#0B0B0C;z-index:3}
.tbl .exn{font-weight:600;font-size:13.5px;line-height:1.25}
.tbl .exn i{font-style:normal;color:var(--gold-text);font-family:var(--f-display);font-size:16px;margin-right:6px}
.tbl td.txt{padding:8px 10px;color:var(--muted);white-space:nowrap}
.tbl td.c{padding:4px 3px}
.tbl td.na{background:var(--surface-2)}
.tbl .tin{height:38px;width:60px;padding:0 5px;font-size:14px;text-align:center;border-radius:6px}
.tbl td.c .set{display:block}
.tbl td.c .set.appr .tin{background:var(--appr-bg);border-color:var(--appr-line)}
.tbl .secrow td{background:var(--gold);color:var(--on-gold);font-family:var(--f-display);font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:5px 12px;font-size:13px;position:sticky;left:0}
.tbl .daterow th,.tbl .daterow td{background:var(--surface-2);padding:5px 4px}
.tbl .daterow th{text-align:left;font-weight:600;color:var(--muted);padding-left:12px}
.tbl .datein{width:100%;min-width:0;height:34px;background:var(--in-bg);border:1px solid var(--in-line);border-radius:6px;padding:0 6px;font-size:12px;color:var(--fg)}
.tbl td.s{padding:8px 10px;text-align:right;font-weight:600;white-space:nowrap}
.tbl td.s.up{color:var(--up)} .tbl td.s.down{color:var(--down)}
.tbl td.bs{padding:8px 10px;text-align:right;color:var(--muted)}
.tbl td.bs.up{color:var(--up);background:var(--up-bg)} .tbl td.bs.down{color:var(--down);background:var(--down-bg)}
.tbl td.notes .notein{margin:0;min-height:38px;height:38px;width:200px;resize:none;padding:8px 10px}
.tfoot-t{margin:26px 0 12px}

/* Resumen */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi span{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;margin-top:4px;font-family:var(--f-display);font-size:42px;line-height:1;font-weight:700;letter-spacing:.01em}
.kpi b small{font-size:20px;color:var(--muted);font-weight:500}
.kpi b.up{color:var(--up)} .kpi b.down{color:var(--down)}
.rt{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.rt th{background:#0B0B0C;color:var(--gold-soft);font-family:var(--f-display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;padding:9px 12px;text-align:right;white-space:nowrap}
.rt th:first-child{text-align:left}
.rt td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line-soft);white-space:nowrap}
.rt td:first-child{text-align:left;white-space:normal;min-width:190px}
.rt td.up{color:var(--up);font-weight:600} .rt td.down{color:var(--down);font-weight:600}
.rt .dayrow td{background:var(--gold);color:var(--on-gold);font-family:var(--f-display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:6px 12px;font-size:13px}
.rt .bar{width:110px;text-align:left}
.bar i{display:block;height:6px;border-radius:0 3px 3px 0;min-width:2px}
.bar i.up{background:var(--up)} .bar i.down{background:var(--down)} .bar i.eq{background:var(--faint)}
.dis{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px;color:var(--muted);font-size:13px}

/* Guía y estados vacíos */
.guide{max-width:68ch;display:grid;gap:12px}
.guide ol{margin:0;padding-left:20px;display:grid;gap:10px}
.guide li::marker{color:var(--gold-text);font-weight:600}
.key{display:inline-block;padding:1px 9px;border-radius:6px;font-size:13px;border:1px solid var(--line);vertical-align:1px}
.key.a{background:var(--appr-bg);border-color:var(--appr-line)}
.key.u{background:var(--up-bg);border-color:var(--up);color:var(--up)}
.key.d{background:var(--down-bg);border-color:var(--down);color:var(--down)}
.empty{max-width:520px;margin:48px auto;display:grid;gap:14px}
.empty h1{font-size:clamp(28px,6vw,38px)}
.empty p{margin:0;color:var(--muted)}
.loading{padding:60px 0;color:var(--muted);text-align:center}
@media (max-width:520px){
  .sets.c4 .inw em{display:none}
  .sets.c4 .setin{padding:0 8px;font-size:18px}
  .sets.c4.rir{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sets.c4.rir .inw em{display:block}
  .sets.c4.rir .setin{padding:0 30px 0 10px;font-size:19px}
  .sets.rir.c4 .lu{display:none}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:10px}
  .brand-t{font-size:20px}
  .card{padding:14px}
}
@media (prefers-reduced-motion:no-preference){ .setin,.wk,.btn{transition:border-color .15s,background .15s,filter .15s} }

/* Modo edición de rutina */
.editbtn{background:transparent;border:1px solid #6B5A27;color:#F0DFA8;border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px}
.editbtn:hover{background:#1c1809}
.editbtn[aria-pressed="true"]{background:#C9A24B;color:#111;border-color:#C9A24B}

<script>
(function(){
'use strict';

/* ───────── Rutina vacía: cada registro empieza desde cero ───────── */
var DEFAULT_PROG = { title:'Registro de cargas', subtitle:'', weeks:8, note:'',
  days:[{ id:'g0', tab:'Día 1', eyebrow:'', title:'', sections:[{ name:'', ex:[] }] }] };
function rid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function newEx(){ return { id:'x'+rid(), name:'Nuevo ejercicio', sets:3, appr:0, reps:'10', rest:'90 s', unit:'kg' }; }
function blankProg(){
  return { title:'Registro de cargas', subtitle:'', weeks:8, note:'',
    days:[{ id:'g'+rid(), tab:'Día 1', eyebrow:'', title:'', sections:[{ name:'', ex:[] }] }] };
}
var MAXSETS=8, MAXWEEKS=52;

/* Índices de la rutina del registro abierto (se recalculan en cada render) */
var PROG=DEFAULT_PROG, DAYS=DEFAULT_PROG.days, WEEKS=8, EX={}, DAYBY={}, NUM={}, MAXS={};
function progOf(a){ return (a&&a.prog&&a.prog.days&&a.prog.days.length)?a.prog:DEFAULT_PROG; }
function dayEx(d){ var r=[]; (d.sections||[]).forEach(function(s){ r=r.concat(s.ex||[]); }); return r; }
function rebuild(){
  PROG=progOf(cur()); DAYS=PROG.days; WEEKS=Math.max(1,Math.min(MAXWEEKS,+PROG.weeks||8));
  EX={}; DAYBY={}; NUM={}; MAXS={};
  DAYS.forEach(function(d){
    DAYBY[d.id]=d; var n=0, m=1;
    dayEx(d).forEach(function(e){ n++; NUM[e.id]=n; EX[e.id]=e; if((e.sets||1)>m) m=e.sets; });
    MAXS[d.id]=m;
  });
}
function U(e){ return e.unit==null?'kg':e.unit; }
function rirOn(){ return PROG.rir!==false; }
function rpeOn(){ return PROG.rpe!==false; }
function repsOf(e,i){ return (e.rr&&e.rr[i])||e.reps||''; }
function repsVary(e){ if(!e.rr||!e.rr.length) return false; var f=repsOf(e,0); for(var i=1;i<(e.sets||1);i++) if(repsOf(e,i)!==f) return true; return false; }
function pauta(e){
  var r=e.reps||'—';
  if(repsVary(e)){ var l=[]; for(var i=0;i<(e.sets||1);i++) l.push(repsOf(e,i)||'—'); r=l.join('/'); }
  return (e.sets||1)+((e.appr>0)?' ('+e.appr+' de aprox.)':'')+' × '+r;
}

/* ───────── Utilidades ───────── */
var $app = document.getElementById('app');
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function isObj(o){ return o && typeof o==='object' && !Array.isArray(o); }
function dm(a,b){ if(!isObj(a)||!isObj(b)) return b; var r={}; var k; for(k in a) r[k]=a[k]; for(k in b) r[k]=(k in a)?dm(a[k],b[k]):b[k]; return r; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function withTimeout(p,ms){ return Promise.race([Promise.resolve(p).catch(function(){return null;}), sleep(ms||6000).then(function(){return null;})]); }
function num(s){ if(s===''||s==null) return null; var v=parseFloat(s); return isFinite(v)?v:null; }
function r2(n){ return Math.round(n*100)/100; }
function fmt(n){ return n==null?'—':String(r2(n)).replace('.',','); }
function fmtSigned(n){ if(n==null) return '—'; return (n>0?'+':'')+String(r2(n)).replace('.',','); }
function fmtPct(p){ if(p==null) return '—'; var v=Math.round(p*1000)/10; return (v>0?'+':'')+String(v).replace('.',',')+' %'; }
function cls(n){ return n==null?'':(n>0?'up':(n<0?'down':'')); }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function todayISO(){ var d=new Date(); var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
function uid(){ return 'a'+rid(); }

/* ───────── Cálculos (las mismas fórmulas del Excel) ───────── */
var SIDEN=['Izq.','Der.'], SIDEL=['Lado izquierdo','Lado derecho'];
function kOf(e,sd){ return sd?e.id+'_R':e.id; }
function sidesOf(e){ return e.uni?[0,1]:[0]; }
function setsOf(a,exId,w){ var l=a.log&&a.log[exId]; var arr=(l&&l['w'+w])||[]; var out=[]; for(var i=0;i<MAXSETS;i++) out.push(arr[i]==null?'':String(arr[i])); return out; }
function rirOf(a,exId,w){ var l=a.rir&&a.rir[exId]; var arr=(l&&l['w'+w])||[]; var out=[]; for(var i=0;i<MAXSETS;i++) out.push(arr[i]==null?'':String(arr[i])); return out; }
function rpeOf(a,exId,w){ var l=a.rpe&&a.rpe[exId]; var v=l&&l['w'+w]; return v==null?'':String(v); }
function rirAvg(a,e,w,sd){ var r=rirOf(a,kOf(e,sd||0),w), s=0, n=0; for(var i=0;i<e.sets;i++){ var v=num(r[i]); if(v!=null){ s+=v; n++; } } return n?s/n:null; }
function bestOf(a,e,w,sd){ var s=setsOf(a,kOf(e,sd||0),w), m=null; for(var i=0;i<e.sets;i++){ var v=num(s[i]); if(v!=null && (m==null||v>m)) m=v; } return m; }
function bestsOf(a,e,sd){ var r=[]; for(var w=1;w<=WEEKS;w++) r.push(bestOf(a,e,w,sd)); return r; }
function statsOf(b){
  var d=b.filter(function(v){return v!=null;});
  if(!d.length) return {first:null,last:null,d:null,pct:null,max:null};
  var first=d[0], last=d[d.length-1];
  return {first:first,last:last,d:last-first,pct:first>0?last/first-1:null,max:Math.max.apply(null,d)};
}
function cmpWeek(a,e,w,sd){ if(w<2) return null; var c=bestOf(a,e,w,sd), p=bestOf(a,e,w-1,sd); return (c!=null&&p!=null)?c-p:null; }
function dateOf(a,dayId,w){ return (a.dates&&a.dates[dayId]&&a.dates[dayId]['w'+w])||''; }
function weekHasData(a,day,w){
  if(dateOf(a,day.id,w)) return true;
  return dayEx(day).some(function(e){ return sidesOf(e).some(function(sd){ return bestOf(a,e,w,sd)!=null; }); });
}
function autoWeek(a,day){ for(var w=WEEKS;w>=1;w--){ if(weekHasData(a,day,w)) return w; } return 1; }

/* ───────── Estado ───────── */
var LS_UI='ad-cargas-ui', LS_SEL='ad-cargas-sel', LS_DATA='ad-cargas-data';
var S = { ready:false, mode:'local', ro:false, athletes:{}, sel:null, tab:'', view:'week', week:{}, menu:false, renaming:false, confirmDel:false, edit:false, confirm:'', focus:null, imp:null, status:'', statusErr:false, dl:null, dirty:false };
try{ var u0=JSON.parse(lsGet(LS_UI)||'{}'); if(u0.tab) S.tab=u0.tab; if(u0.view) S.view=u0.view; }catch(e){}
S.sel = lsGet(LS_SEL);
function saveUI(){ lsSet(LS_UI, JSON.stringify({tab:S.tab,view:S.view})); }
function cur(){ return S.athletes[S.sel]||null; }
function sortedAthletes(){ return Object.keys(S.athletes).map(function(k){return S.athletes[k];}).sort(function(x,y){ return String(x.name).localeCompare(String(y.name),'es'); }); }
function ensureSel(){ if(!S.athletes[S.sel]){ var l=sortedAthletes(); S.sel=l.length?l[0].id:null; if(S.sel) lsSet(LS_SEL,S.sel); } }
function curWeek(day){ var a=cur(); return clamp(S.week[day.id]||(a?autoWeek(a,day):1),1,WEEKS); }
function validTab(){ if(S.tab==='res'||S.tab==='gui'||DAYBY[S.tab]) return; S.tab=DAYS[0].id; }

/* ───────── Almacenamiento: db compartida o navegador ───────── */
var DB=null, pend={}, inflight={}, busy={}, timers={};
function persistLocal(){ lsSet(LS_DATA, JSON.stringify(S.athletes)); }
function setStatus(t,err){
  S.status=t; S.statusErr=!!err;
  var el=document.getElementById('status'); if(el){ el.textContent=t; el.className='status'+(err?' err':''); }
}
function patch(id,p){
  if(S.ro) return;
  S.athletes[id]=dm(S.athletes[id],p);
  pend[id]=dm(pend[id]||{},p);
  setStatus('Guardando…');
  clearTimeout(timers[id]); timers[id]=setTimeout(function(){ flush(id); },650);
}
async function flush(id){
  if(busy[id]) return; busy[id]=true;
  try{
    while(pend[id]){
      var p=pend[id]; pend[id]=null; inflight[id]=p;
      if(DB){ await DB.doc('athletes/'+id).update(p); } else { persistLocal(); }
      inflight[id]=null;
    }
    setStatus(DB?'Guardado':'Guardado en este navegador');
  }catch(e){
    inflight[id]=null;
    var code=e&&e.code;
    if(code==='invalid_argument'){ S.ro=true; S.edit=false; setStatus('Sin permiso para guardar',true); render(); }
    else setStatus('No se pudo guardar. Inténtalo de nuevo.',true);
  }finally{ busy[id]=false; }
}
/* Cambia la rutina del registro abierto: fn recibe una copia editable */
function mutProg(fn){
  var a=cur(); if(!a||S.ro) return false;
  var p=clone(progOf(a)); fn(p);
  patch(a.id,{prog:p}); rebuild();
  return true;
}
async function createAthlete(name,prog,seed){
  var id=uid();
  var doc=seed||{log:{},dates:{},notes:{}};
  doc.name=name; doc.createdAt=Date.now(); doc.id=id; doc.prog=prog||clone(DEFAULT_PROG);
  S.athletes[id]=doc; S.sel=id; lsSet(LS_SEL,id); S.week={}; S.menu=false; S.edit=!S.ro; S.tab=''; S.view='week'; S.focus='input.pd[data-f="title"]';
  render();
  try{
    if(DB){ setStatus('Guardando…'); await DB.doc('athletes/'+id).set(doc); setStatus('Guardado'); }
    else { persistLocal(); setStatus('Guardado en este navegador'); }
  }catch(e){
    delete S.athletes[id]; ensureSel(); render();
    setStatus('No se pudo crear el registro',true);
  }
}
async function renameAthlete(id,name){
  S.athletes[id]=dm(S.athletes[id],{name:name}); S.renaming=false; render();
  try{ if(DB){ await DB.doc('athletes/'+id).update({name:name}); } else persistLocal(); setStatus(DB?'Guardado':'Guardado en este navegador'); }
  catch(e){ setStatus('No se pudo renombrar',true); }
}
async function deleteAthlete(id){
  var old=S.athletes[id]; delete S.athletes[id]; S.confirmDel=false; S.menu=false; S.edit=false; ensureSel(); S.week={}; render();
  try{ if(DB){ await DB.doc('athletes/'+id).delete(); } else persistLocal(); setStatus(DB?'Guardado':'Guardado en este navegador'); }
  catch(e){ S.athletes[id]=old; ensureSel(); render(); setStatus('No se pudo eliminar',true); }
}
function onRemote(map){
  Object.keys(map).forEach(function(id){
    if(inflight[id]) map[id]=dm(map[id],inflight[id]);
    if(pend[id]) map[id]=dm(map[id],pend[id]);
  });
  Object.keys(S.athletes).forEach(function(id){ if(!map[id] && (pend[id]||inflight[id]||busy[id])) map[id]=S.athletes[id]; });
  var first=!S.ready;
  if(!first && JSON.stringify(map)===JSON.stringify(S.athletes)) return;
  S.athletes=map; S.ready=true; ensureSel();
  if(!first && inField()){ S.dirty=true; return; }
  render();
}
function inField(){ var a=document.activeElement; return !!(a && $app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }

/* ───────── Gráfico de progresión (una serie) ───────── */
function spark(a,e,sd){
  var b=bestsOf(a,e,sd), pts=[], un=U(e);
  b.forEach(function(v,i){ if(v!=null) pts.push({w:i+1,v:v}); });
  var W=320,H=108,pl=36,pr=16,pt=20,pb=22, pw=W-pl-pr, ph=H-pt-pb;
  var x=function(w){ return WEEKS===1?pl+pw/2:pl+(w-1)/(WEEKS-1)*pw; };
  var step=WEEKS<=12?1:Math.ceil(WEEKS/12);
  var s='<svg class="spk" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Progresión de '+esc(e.name)+(e.uni?', '+SIDEL[sd||0].toLowerCase():'')+' por semana">';
  s+='<line class="base" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(pt+ph)+'" y2="'+(pt+ph)+'"/>';
  for(var w=1;w<=WEEKS;w++) if((w-1)%step===0) s+='<text class="ax" x="'+x(w)+'" y="'+(H-6)+'" text-anchor="middle">'+w+'</text>';
  s+='<text class="ax" x="'+(pl-8)+'" y="'+(H-6)+'" text-anchor="end">Sem.</text>';
  if(!pts.length){
    s+='<text class="empty" x="'+(W/2)+'" y="'+(pt+ph/2+4)+'" text-anchor="middle">Sin datos todavía</text></svg>';
    return s;
  }
  var vs=pts.map(function(p){return p.v;}), mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  var lo=mn, hi=mx;
  if(hi===lo){ lo-=1; hi+=1; } else { var sp=hi-lo; lo-=sp*.14; hi+=sp*.14; }
  var y=function(v){ return pt+ph-(v-lo)/(hi-lo)*ph; };
  s+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(mx)+'" y2="'+y(mx)+'"/>';
  s+='<text class="ax" x="'+(pl-6)+'" y="'+(y(mx)+3.5)+'" text-anchor="end">'+fmt(mx)+'</text>';
  if(mn!==mx){
    s+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(mn)+'" y2="'+y(mn)+'"/>';
    s+='<text class="ax" x="'+(pl-6)+'" y="'+(y(mn)+3.5)+'" text-anchor="end">'+fmt(mn)+'</text>';
  }
  if(pts.length>1) s+='<polyline class="ln" points="'+pts.map(function(p){return x(p.w).toFixed(1)+','+y(p.v).toFixed(1);}).join(' ')+'"/>';
  pts.forEach(function(p,i){
    var last=i===pts.length-1;
    s+='<circle class="'+(last?'last':'pt')+'" cx="'+x(p.w).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+(last?4.5:3)+'"><title>Semana '+p.w+': '+fmt(p.v)+' '+esc(un)+'</title></circle>';
  });
  var L=pts[pts.length-1], late=L.w>=WEEKS-1&&WEEKS>2, anchor=late?'end':'middle', lx=late?x(L.w)+4:x(L.w);
  s+='<text class="val" x="'+lx.toFixed(1)+'" y="'+(y(L.v)-9).toFixed(1)+'" text-anchor="'+anchor+'">'+fmt(L.v)+' '+esc(un)+'</text>';
  return s+'</svg>';
}
function statsHtml(a,e,sd){
  var s=statsOf(bestsOf(a,e,sd)), u=U(e);
  function c(label,val,k){ return '<div class="st"><span>'+label+'</span><b class="'+(k||'')+'">'+val+'</b></div>'; }
  return c('Inicial',s.first==null?'—':fmt(s.first)+' '+esc(u))+c('Último',s.last==null?'—':fmt(s.last)+' '+esc(u))+
    c('Δ '+esc(u),fmtSigned(s.d),cls(s.d))+c('Δ %',fmtPct(s.pct),cls(s.pct))+c('Máx',s.max==null?'—':fmt(s.max)+' '+esc(u));
}
function liveHtml(a,e,w,sd){
  sd=sd||0; var b=bestOf(a,e,w,sd), p=w>1?bestOf(a,e,w-1,sd):null, h='', u=esc(U(e));
  if(b==null){
    h='<span>Sin registrar esta semana</span>';
  } else {
    h='<span>Mejor serie <b>'+fmt(b)+' '+u+'</b></span>';
    if(p!=null){
      var d=b-p;
      if(d>0) h+='<span class="chip up">▲ '+fmtSigned(d)+' '+u+' ('+fmtPct(p>0?b/p-1:null)+')</span>';

        rows+='<tr><td>'+esc(e.name)+(e.uni?' · '+SIDEN[sd]:'')+'</td><td>'+(s.first==null?'':fmt(s.first)+' '+u)+'</td><td>'+(s.last==null?'':fmt(s.last)+' '+u)+'</td><td class="'+k+'">'+(s.d==null?'':fmtSigned(s.d)+' '+u)+'</td><td class="'+cls(s.pct)+'">'+(s.pct==null?'':fmtPct(s.pct))+'</td><td>'+(s.max==null?'':fmt(s.max)+' '+u)+'</td><td class="bar">'+(s.pct!=null?'<i class="'+(s.pct>0?'up':(s.pct<0?'down':'eq'))+'" style="width:'+bw+'%"></i>':'')+'</td></tr>';

    (all.length?'<div class="tscroll"><table class="rt"><thead><tr><th>Ejercicio</th><th>Inicial</th><th>Último</th><th>Δ</th><th>Δ %</th><th>Máx</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="emptyday">Todavía no hay ejercicios. Pulsa «Editar rutina» y añade el primero.</div>')+
    '<div class="dis"><span>Se calcula solo con la mejor serie de cada semana. Nada que editar aquí.</span>'+(S.dl?'<button class="btn ghost sm" data-act="csv">Exportar a CSV</button>':'')+'</div>';
}

function refresh(){

    var k=el.dataset.d, e=EX[el.dataset.ex], w=+el.dataset.w, sd=+el.dataset.sd||0;

    else if(k==='tstat'){ var s=statsOf(bestsOf(a,e,sd)), kk=el.dataset.k, t='', c2='';
      if(kk==='first') t=s.first==null?'':fmt(s.first); else if(kk==='last') t=s.last==null?'':fmt(s.last); else if(kk==='max') t=s.max==null?'':fmt(s.max);
      else if(kk==='d'){ t=s.d==null?'':fmtSigned(s.d); c2=cls(s.d); } else if(kk==='pct'){ t=s.pct==null?'':fmtPct(s.pct); c2=cls(s.pct); }

/* ───────── Edición de rutina: operaciones ───────── */
function findEx(p,id){
  for(var di=0;di<p.days.length;di++){ var secs=p.days[di].sections||[]; for(var si=0;si<secs.length;si++){ var ex=secs[si].ex||[]; for(var ei=0;ei<ex.length;ei++) if(ex[ei].id===id) return {di:di,si:si,ei:ei,e:ex[ei],sec:secs[si]}; } }
  return null;
}
function findDay(p,id){ for(var i=0;i<p.days.length;i++) if(p.days[i].id===id) return {i:i,d:p.days[i]}; return null; }
function swap(arr,i,d){ var j=i+d; if(j<0||j>=arr.length) return; var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
function onPf(el){
  var id=el.dataset.ex, f=el.dataset.f, v=el.value;
  var ix=+el.dataset.i;
  mutProg(function(p){ var r=findEx(p,id); if(!r) return;
    if(f==='unit') r.e.unit=v;
    else if(f==='hint'){ if(v) r.e.hint=v; else delete r.e.hint; }
    else if(f==='uni'){ if(el.checked) r.e.uni=true; else delete r.e.uni; }
    else if(f==='rr'){ var rr=Array.isArray(r.e.rr)?r.e.rr.slice():[]; while(rr.length<(r.e.sets||1)) rr.push(''); rr[ix]=v; if(rr.some(function(x){return !!x;})) r.e.rr=rr; else delete r.e.rr; }
    else r.e[f]=v; });
  if(f==='reps'){ var ph=v||'—'; Array.prototype.forEach.call($app.querySelectorAll('.rrin[data-ex="'+id+'"]'),function(x){ x.placeholder=ph; }); }
  if(f==='uni') render(); else refresh();
}
function onPd(el){
  var id=el.dataset.day, f=el.dataset.f, v=el.value;
  mutProg(function(p){ var r=findDay(p,id); if(r) r.d[f]=v; });
  if(f==='tab'){ var tb=$app.querySelector('.tab[data-id="'+id+'"]'); if(tb) tb.textContent=v||'Día'; }
}
function onPs(el){
  var id=el.dataset.day, si=+el.dataset.s, v=el.value;
  mutProg(function(p){ var r=findDay(p,id); if(r&&r.d.sections[si]) r.d.sections[si].name=v; });
}
function onPp(el){ var f=el.dataset.f, v=el.value; mutProg(function(p){ p[f]=v; }); }

/* ───────── Eventos ───────── */
function onSet(el){
  var v=el.value.replace(',','.').replace(/[^0-9.]/g,''), dot=v.indexOf('.');
  if(dot>=0) v=v.slice(0,dot+1)+v.slice(dot+1).replace(/\./g,'');
  var disp=v.replace('.',','); if(el.value!==disp) el.value=disp;
  var a=cur(); if(!a||S.ro) return;
  var ex=el.dataset.ex+(el.dataset.sd==='1'?'_R':''), w=+el.dataset.w, i=+el.dataset.i, arr=setsOf(a,ex,w);
  if(arr[i]===v) return;
  arr[i]=v;
  while(arr.length && arr[arr.length-1]==='') arr.pop();
  var p={log:{}}; p.log[ex]={}; p.log[ex]['w'+w]=arr;
  patch(a.id,p); refresh();
}
function onRir(el){
  var v=el.value.replace(/[^0-9]/g,'').slice(0,2); if(v!==''&&+v>10) v='10';
  if(el.value!==v) el.value=v;
  var a=cur(); if(!a||S.ro) return;
  var ex=el.dataset.ex+(el.dataset.sd==='1'?'_R':''), w=+el.dataset.w, i=+el.dataset.i, arr=rirOf(a,ex,w);
  if(arr[i]===v) return;
  arr[i]=v; while(arr.length && arr[arr.length-1]==='') arr.pop();
  var p={rir:{}}; p.rir[ex]={}; p.rir[ex]['w'+w]=arr;
  patch(a.id,p); refresh();
}
function onRpe(el){
  var v=el.value.replace(',','.').replace(/[^0-9.]/g,''), dot=v.indexOf('.');
  if(dot>=0) v=v.slice(0,dot+1)+v.slice(dot+1).replace(/\./g,'');
  if(v!=='' && parseFloat(v)>10) v='10';
  var disp=v.replace('.',','); if(el.value!==disp) el.value=disp;
  var a=cur(); if(!a||S.ro) return;
  var ex=el.dataset.ex, w=+el.dataset.w;
  if(rpeOf(a,ex,w)===v) return;
  var p={rpe:{}}; p.rpe[ex]={}; p.rpe[ex]['w'+w]=v;
  patch(a.id,p); refresh();
}
function onDate(el){
  var a=cur(); if(!a||S.ro) return;
  var d=el.dataset.day, w=+el.dataset.w;
  if(dateOf(a,d,w)===el.value) return;
  var p={dates:{}}; p.dates[d]={}; p.dates[d]['w'+w]=el.value;
  patch(a.id,p); refresh();
}
function onNote(el){
  var a=cur(); if(!a||S.ro) return;
  var ex=el.dataset.ex, p={notes:{}}; p.notes[ex]=el.value;
  patch(a.id,p);
}
$app.addEventListener('input',function(ev){
  var t=ev.target, c=t.classList;
  if(c.contains('setin')) onSet(t);
  else if(c.contains('ririn')) onRir(t);
  else if(c.contains('rpein')) onRpe(t);
  else if(c.contains('datein')) onDate(t);
  else if(c.contains('pf')) onPf(t);
  else if(c.contains('pd')) onPd(t);
  else if(c.contains('ps')) onPs(t);
  else if(c.contains('pp')) onPp(t);
  else if(c.contains('notein')) onNote(t);
});

  var b=ev.target.closest('[data-act]'); if(!b||b.disabled) return;

  else if(act==='view'){ S.view=ds.v; saveUI(); render(); }

  else if(act==='imprest') applyImport('rest');
  else if(act==='edit'){ S.edit=!S.edit; S.view='week'; render(); }
  else if(act==='step'){
    mutProg(function(p){ var r=findEx(p,ds.ex); if(!r) return; var e=r.e, d=+ds.d;
      if(ds.f==='sets'){ e.sets=clamp((e.sets||1)+d,1,MAXSETS); e.appr=Math.min(e.appr||0,e.sets-1); if(e.rr){ e.rr=e.rr.slice(0,e.sets); if(!e.rr.some(function(x){return !!x;})) delete e.rr; } }
      else e.appr=clamp((e.appr||0)+d,0,Math.max(0,(e.sets||1)-1)); });
    render();
  }
  else if(act==='weeks'){ mutProg(function(p){ p.weeks=clamp((+p.weeks||8)+(+ds.d),1,MAXWEEKS); }); rebuild(); render(); }
  else if(act==='mvex'){ mutProg(function(p){ var r=findEx(p,ds.ex); if(r) swap(r.sec.ex,r.ei,+ds.d); }); render(); }
  else if(act==='mvsec'){ mutProg(function(p){ var r=findDay(p,ds.day); if(r) swap(r.d.sections,+ds.s,+ds.d); }); render(); }
  else if(act==='mvday'){ mutProg(function(p){ var r=findDay(p,ds.day); if(r) swap(p.days,r.i,+ds.d); }); render(); }
  else if(act==='addex'){ var ne=newEx(); mutProg(function(p){ var r=findDay(p,ds.day); if(r&&r.d.sections[+ds.s]) r.d.sections[+ds.s].ex.push(ne); }); S.focus='input.name-in[data-ex="'+ne.id+'"]'; render(); }

  else if(act==='addday'){
    var ne3=newEx(), nid='g'+rid();
    mutProg(function(p){ var n=p.days.length+1; p.days.push({id:nid,tab:'Día '+n,eyebrow:'Día '+n,title:'Nueva sesión',sections:[{name:'Trabajo principal',ex:[ne3]}]}); });
    S.tab=nid; saveUI(); S.focus='input.pd[data-f="title"]'; render(); window.scrollTo(0,0);
  }
  else if(act==='delex'){ mutProg(function(p){ var r=findEx(p,ds.ex); if(r) r.sec.ex.splice(r.ei,1); }); render(); }
  else if(act==='delsec'){ mutProg(function(p){ var r=findDay(p,ds.day); if(r) r.d.sections.splice(+ds.s,1); }); render(); }
  else if(act==='delday'){ mutProg(function(p){ var r=findDay(p,ds.day); if(r&&p.days.length>1) p.days.splice(r.i,1); }); S.tab=''; render(); window.scrollTo(0,0); }
});


/* ───────── Copia de seguridad: guardar e importar ───────── */
var LS_BK='ad-cargas-lastbackup', ID_RE=/^[A-Za-z0-9_-]{1,40}$/, KEY_RE=/^[A-Za-z0-9_-]{1,42}$/;
function lastBackup(){ var v=+lsGet(LS_BK); return v>0?v:0; }
function fmtDate(ts){ try{ return new Date(ts).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return ''; } }
function slug(s){ return String(s||'registro').replace(/[^\w\-]+/g,'_').replace(/^_+|_+$/g,'')||'registro'; }
function str(v,max){ return String(v==null?'':v).slice(0,max); }
function sid(v,prefix){ return (typeof v==='string'&&ID_RE.test(v))?v:prefix+rid(); }
function exportPayload(list){
  return JSON.stringify({app:'registro-cargas',version:1,exportedAt:new Date().toISOString(),athletes:list.map(function(a){return clone(a);})},null,1);
}
function saveFile(name,text){
  if(S.dl) return S.dl.save({filename:name,data:text}).then(function(){return true;},function(e){ if(e&&e.code==='declined') return false; throw e; });
  if(window.claude) return Promise.reject(new Error('sin descargas'));
  return new Promise(function(res,rej){
    try{
      var blob=new Blob([text],{type:'application/json'}), url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },3000); res(true);
    }catch(e){ rej(e); }
  });
}
async function doBackup(all){
  var list=all?sortedAthletes():(cur()?[cur()]:[]); if(!list.length) return;
  var name=all?'Copia_registro_cargas_'+todayISO()+'.json':'Copia_'+slug(cur().name)+'_'+todayISO()+'.json';
  try{
    var ok=await saveFile(name,exportPayload(list));
    if(ok){ lsSet(LS_BK,String(Date.now())); setStatus('Copia guardada'); render(); }
  }catch(e){ setStatus('No se pudo guardar la copia en esta vista',true); }
}
function cleanSets(m){
  var out={}; if(!isObj(m)) return out;
  Object.keys(m).slice(0,2000).forEach(function(k){
    if(!KEY_RE.test(k)||!isObj(m[k])) return;
    var o={};
    Object.keys(m[k]).forEach(function(wk){
      if(!/^w([1-9]|[1-4][0-9]|5[0-2])$/.test(wk)) return;
      var arr=Array.isArray(m[k][wk])?m[k][wk]:[];
      o[wk]=arr.slice(0,MAXSETS).map(function(v){ v=String(v==null?'':v); return /^[0-9]{0,3}(\.[0-9]{0,2})?$/.test(v)?v:''; });
    });
    out[k]=o;
  });
  return out;
}
function cleanRpe(m){
  var out={}; if(!isObj(m)) return out;
  Object.keys(m).slice(0,2000).forEach(function(k){
    if(!ID_RE.test(k)||!isObj(m[k])) return;
    var o={};
    Object.keys(m[k]).forEach(function(wk){ if(/^w([1-9]|[1-4][0-9]|5[0-2])$/.test(wk)){ var v=String(m[k][wk]==null?'':m[k][wk]); o[wk]=/^(10|[0-9](\.[0-9])?)?$/.test(v)?v:''; } });
    out[k]=o;
  });
  return out;
}
function cleanDates(m){
  var out={}; if(!isObj(m)) return out;
  Object.keys(m).slice(0,60).forEach(function(k){
    if(!ID_RE.test(k)||!isObj(m[k])) return;
    var o={};
    Object.keys(m[k]).forEach(function(wk){ if(/^w([1-9]|[1-4][0-9]|5[0-2])$/.test(wk)){ var v=String(m[k][wk]==null?'':m[k][wk]); o[wk]=/^\d{4}-\d{2}-\d{2}$/.test(v)?v:''; } });
    out[k]=o;
  });
  return out;
}
function cleanNotes(m){
  var out={}; if(!isObj(m)) return out;
  Object.keys(m).slice(0,2000).forEach(function(k){ if(ID_RE.test(k)) out[k]=str(m[k],300); });
  return out;
}
function cleanProg(p){
  if(!isObj(p)||!Array.isArray(p.days)||!p.days.length) return null;
  var seen={}, uniq=function(v,pre){ var id=sid(v,pre); while(seen[id]) id=pre+rid(); seen[id]=1; return id; };
  var out={title:str(p.title,40),subtitle:str(p.subtitle,60),note:str(p.note,300),weeks:clamp(parseInt(p.weeks,10)||8,1,MAXWEEKS),days:[]};
  if(p.rir===false) out.rir=false; if(p.rpe===false) out.rpe=false;
  p.days.slice(0,30).forEach(function(d){
    if(!isObj(d)) return;
    var day={id:uniq(d.id,'g'),tab:str(d.tab,14),eyebrow:str(d.eyebrow,50),title:str(d.title,60),sections:[]};
    (Array.isArray(d.sections)?d.sections:[]).slice(0,30).forEach(function(s){
      if(!isObj(s)) return;
      var sec={name:str(s.name,50),ex:[]};
      (Array.isArray(s.ex)?s.ex:[]).slice(0,60).forEach(function(e){
        if(!isObj(e)) return;
        var sets=clamp(parseInt(e.sets,10)||3,1,MAXSETS);
        var ex={id:uniq(e.id,'x'),name:str(e.name,80),sets:sets,appr:clamp(parseInt(e.appr,10)||0,0,sets-1),reps:str(e.reps,20),rest:str(e.rest,14),unit:str(e.unit==null?'kg':e.unit,8)};
        if(e.hint) ex.hint=str(e.hint,120);
        if(e.uni===true) ex.uni=true;
        if(Array.isArray(e.rr)){ var rr=[]; for(var q=0;q<sets;q++) rr.push(str(e.rr[q],12)); if(rr.some(function(x){return !!x;})) ex.rr=rr; }
        sec.ex.push(ex);
      });
      day.sections.push(sec);
    });
    out.days.push(day);
  });
  return out.days.length?out:null;
}
function cleanAthlete(x){
  if(!isObj(x)) return null;
  return { id:sid(x.id,'a'), name:str(x.name,40).trim()||'Sin nombre', createdAt:(+x.createdAt>0?+x.createdAt:Date.now()),
    prog:cleanProg(x.prog)||clone(DEFAULT_PROG), log:cleanSets(x.log), rir:cleanSets(x.rir), rpe:cleanRpe(x.rpe), dates:cleanDates(x.dates), notes:cleanNotes(x.notes) };
}
function parseBackup(d){
  if(!isObj(d)||d.app!=='registro-cargas'||!Array.isArray(d.athletes)) throw new Error('formato');
  var list=[]; d.athletes.slice(0,200).forEach(function(x){ var c=cleanAthlete(x); if(c) list.push(c); });
  if(!list.length) throw new Error('vacía');
  return {list:list,dupes:list.filter(function(c){return !!S.athletes[c.id];}).length,at:str(d.exportedAt,40)};
}
function readImport(file){
  if(!file) return;
  if(file.size>5*1024*1024){ setStatus('El archivo es demasiado grande',true); return; }
  var fr=new FileReader();
  fr.onload=function(){
    try{ S.imp=parseBackup(JSON.parse(String(fr.result))); if(cur()) S.menu=true; setStatus(''); render(); }
    catch(e){ S.imp=null; setStatus('Ese archivo no es una copia válida de este registro',true); }
  };
  fr.onerror=function(){ setStatus('No se pudo leer el archivo',true); };
  fr.readAsText(file);
}
async function applyImport(mode){
  var imp=S.imp; if(!imp||S.ro) return; S.imp=null;
  var names={}; Object.keys(S.athletes).forEach(function(k){ names[String(S.athletes[k].name).toLowerCase()]=1; });
  var failed=0, firstId=null, done=0;
  setStatus('Importando…');
  for(var i=0;i<imp.list.length;i++){
    var doc=clone(imp.list[i]);
    if(mode==='new'){ doc.id=uid(); if(names[doc.name.toLowerCase()]) doc.name=str(doc.name+' (importado)',40); names[doc.name.toLowerCase()]=1; }
    var prev=S.athletes[doc.id]; pend[doc.id]=null;
    S.athletes[doc.id]=doc;
    try{ if(DB) await DB.doc('athletes/'+doc.id).set(doc); done++; if(!firstId) firstId=doc.id; }
    catch(e){ failed++; if(prev) S.athletes[doc.id]=prev; else delete S.athletes[doc.id]; }
  }
  if(!DB) persistLocal();
  if(firstId){ S.sel=firstId; lsSet(LS_SEL,firstId); }
  ensureSel(); S.week={}; S.tab=''; S.menu=false; S.edit=false;
  render();
  setStatus(failed?('Importados '+done+', con '+failed+' errores'):('Copia importada: '+done+(done===1?' registro':' registros')), !!failed);
}
function backupHtml(){
  var lb=lastBackup(), h='<div><h4>Copia de seguridad</h4><div class="rowf">';
  h+='<button class="btn ghost sm" data-act="bkall">Guardar copia de todos</button>';
  if(cur()) h+='<button class="btn ghost sm" data-act="bkone">Guardar solo este registro</button>';
  if(!S.ro) h+='<button class="btn ghost sm" data-act="impick">Importar copia…</button>';
  h+='</div><p class="bkhint">Se guarda un archivo .json con rutinas, cargas, RIR, esfuerzo y notas. Guárdalo en Archivos, Drive o iCloud. Para recuperar los datos, impórtalo aquí.'+(lb?' Última copia: '+esc(fmtDate(lb))+'.':' Todavía no has guardado ninguna copia.')+'</p></div>';
  return h;
}
function importPanelHtml(){
  var imp=S.imp; if(!imp) return '';
  var names=imp.list.slice(0,6).map(function(c){return '«'+esc(c.name)+'»';}).join(', ')+(imp.list.length>6?' y '+(imp.list.length-6)+' más':'');
  var h='<div class="confirm"><div><b>Copia lista para importar</b>'+(imp.at?' · guardada el '+esc(fmtDate(imp.at)):'')+'<br>'+imp.list.length+(imp.list.length===1?' registro: ':' registros: ')+names+'.'+(imp.dupes?'<br>'+imp.dupes+(imp.dupes===1?' ya existe':' ya existen')+' aquí. Puedes añadirlos como registros nuevos o sustituir los existentes por los de la copia.':'')+'</div><div class="rowf">';
  if(imp.dupes) h+='<button class="btn" data-act="impnew">Añadir como nuevos</button><button class="btn danger" data-act="imprest">Sustituir los existentes</button>';
  else h+='<button class="btn" data-act="imprest">Importar</button>';
  return h+'<button class="btn ghost" data-act="impcancel">Cancelar</button></div></div>';
}

/* ───────── Exportar CSV ───────── */
async function exportCsv(a){
  function q(s){ return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'; }
  var mx=1; DAYS.forEach(function(d){ if(MAXS[d.id]>mx) mx=MAXS[d.id]; });
  var head=['Día','Ejercicio','Series x reps','Descanso','Semana','Fecha']; for(var i=1;i<=mx;i++) head.push('S'+i);
  for(i=1;i<=mx;i++) head.push('RIR S'+i);
  head=head.concat(['Esfuerzo percibido','Mejor serie','Unidad','Notas']);
  var rows=[head];
  DAYS.forEach(function(d){ dayEx(d).forEach(function(e){
    sidesOf(e).forEach(function(sd){
    for(var w=1;w<=WEEKS;w++){
      var s=setsOf(a,kOf(e,sd),w), b=bestOf(a,e,w,sd), dt=dateOf(a,d.id,w);
      if(b==null && !dt && !rpeOf(a,e.id,w)) continue;
      var r=[d.tab,e.name+(e.uni?' ('+SIDEN[sd]+')':''),pauta(e),e.rest||'',w,dt];
      var rr=rirOf(a,kOf(e,sd),w);
      for(var k=0;k<mx;k++) r.push(k<e.sets?s[k].replace('.',','):'');
      for(k=0;k<mx;k++) r.push(k<e.sets?rr[k]:'');
      r=r.concat([rpeOf(a,e.id,w).replace('.',','),b==null?'':fmt(b),U(e),(a.notes&&a.notes[e.id])||'']);
      rows.push(r);
    }
    });
  }); });
  var text='﻿'+rows.map(function(r){return r.map(q).join(';');}).join('\r\n');
  try{ await S.dl.save({filename:'Registro_cargas_'+a.name.replace(/[^\w\-]+/g,'_')+'.csv',data:text}); }
  catch(e){ if(!e||e.code!=='declined') setStatus('No se pudo exportar',true); }
}

/* ───────── Arranque ───────── */
async function init(){
  render();
  var db=null,user=null,dl=null;
  if(window.claude && window.claude.use){
    var r=await Promise.all([withTimeout(window.claude.use('db')),withTimeout(window.claude.use('user')),withTimeout(window.claude.use('downloads'))]);
    db=r[0]; user=r[1]; dl=r[2];
  }
  S.dl=dl;
  if(db){
    DB=db; S.mode='db';
    try{ if(user && user.can){ var c=await user.can('data.write'); if(c===false) S.ro=true; } }catch(e){}
    try{
      db.collection('athletes').onSnapshot(function(snap){
        var m={}; snap.docs.forEach(function(d){ if(d.exists){ var o=clone(d.data()); o.id=d.id; m[d.id]=o; } });
        onRemote(m);
      },function(){ DB=null; S.mode='local'; loadLocal(); render(); });
    }catch(e){ DB=null; S.mode='local'; loadLocal(); render(); }
  } else {
    S.mode='local'; loadLocal(); render();
  }
}
function loadLocal(){
  try{ var d=JSON.parse(lsGet(LS_DATA)||'{}'); Object.keys(d).forEach(function(k){ d[k].id=k; }); S.athletes=d; }catch(e){ S.athletes={}; }
  S.ready=true; ensureSel();
}
init();
})();
